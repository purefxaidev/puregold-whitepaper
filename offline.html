  <title>PureGold — Offline</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <style>
    :root { --gold:#d4b15f; --text:#eee8db; --muted:#9a917f; }
    html,body { margin:0; min-height:100vh; background:#100e0a; color:var(--text); overflow-x:hidden; max-width:100%; -webkit-text-size-adjust:100%; text-size-adjust:100%;
      font-family:'IBM Plex Sans Thai',Manrope,system-ui,sans-serif; display:flex; align-items:center; justify-content:center;

<body>
  <main>
    <img src="icons/icon-192.png" alt="PureGold">
    <h1>PureGold</h1>
    <p class="th">ตอนนี้ยังออฟไลน์อยู่ ราคาและข่าวต้องใช้การเชื่อมต่ออินเทอร์เน็ต กดลองอีกครั้งเมื่อออนไลน์แล้ว</p>
    <p class="en" hidden>You are offline. Live prices and news need a connection. Try again when you are back online.</p>
    <button type="button" id="retry">ลองอีกครั้ง</button>
  </main>
  <script>
    (function () {
      var en = ((navigator.language || 'th').toLowerCase().indexOf('th') !== 0);
      try { en = localStorage.getItem('pg_lang') === 'en'; } catch (e) {}
      document.querySelector('.th').hidden = en;
      document.querySelector('.en').hidden = !en;
      document.getElementById('retry').textContent = en ? 'Try again' : 'ลองอีกครั้ง';
      document.getElementById('retry').onclick = function () { location.href = './'; };
    })();
  </script>
