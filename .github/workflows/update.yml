name: Update landing levels

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-landing-levels
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh spot, chart series, and support / resistance
        env:
          TZ: Asia/Bangkok
        run: python3 scripts/update_levels.py

      - name: Commit and push
        env:
          TZ: Asia/Bangkok
        run: |
          git config user.name "purefxaidev"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/levels.json assets/xau-klines.json assets/quotes.json assets/spdr.json \
            data/xau-klines.json data/quotes.json data/live.json index.html || true
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "update levels $(date '+%F %H:%M')"
          git pull --rebase --autostash origin main
          git push origin main
