<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100e0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>PureGold — Offline</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <style>
    :root { --gold:#d4b15f; --text:#eee8db; --muted:#9a917f; }
    html,body { margin:0; min-height:100vh; background:#100e0a; color:var(--text);
      font-family:'IBM Plex Sans Thai',Manrope,system-ui,sans-serif; display:flex; align-items:center; justify-content:center;
      padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px)); text-align:center; }
    img { width:96px; height:96px; border-radius:22px; display:block; margin:0 auto 18px; }
    h1 { margin:0 0 8px; font-size:22px; letter-spacing:.04em; color:#ead7a2; }
    p { margin:0 0 18px; color:var(--muted); max-width:28em; line-height:1.55; }
    button { font:inherit; font-weight:700; padding:12px 20px; border-radius:10px; border:0; cursor:pointer;
      background:var(--gold); color:#16120a; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="PureGold">
    <h1>PureGold</h1>
    <p class="th">ตอนนี้ยังออฟไลน์อยู่ ราคาและข่าวต้องใช้การเชื่อมต่ออินเทอร์เน็ต กดลองอีกครั้งเมื่อออนไลน์แล้ว</p>
    <p class="en" hidden>You are offline. Live prices and news need a connection. Try again when you are back online.</p>
    <button type="button" id="retry">ลองอีกครั้ง</button>
  </main>
  <script>
    (function () {
      var en = ((navigator.language || 'th').toLowerCase().indexOf('th') !== 0);
      try { en = localStorage.getItem('pg_lang') === 'en'; } catch (e) {}
      document.querySelector('.th').hidden = en;
      document.querySelector('.en').hidden = !en;
      document.getElementById('retry').textContent = en ? 'Try again' : 'ลองอีกครั้ง';
      document.getElementById('retry').onclick = function () { location.href = './'; };
    })();
  </script>
</body>
</html>
