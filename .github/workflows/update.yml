name: Update landing levels
# GitHub cron is supplemented by a box-side refresh every ~5 minutes (xau-klines.json / quotes).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-landing-levels
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh spot, chart series, support / resistance, and market desk
        env:
          TZ: Asia/Bangkok
        run: |
          python3 scripts/update_levels.py
          python3 scripts/update_perf.py --out assets/perf.json assets/trade_plan.json --out data/perf.json data/trade_plan.json || echo "perf skipped"
          python3 scripts/update_trade_plan.py --out assets/trade_plan.json --out data/trade_plan.json || echo "trade plan skipped"
          python3 scripts/update_thai_gold.py --out assets/thai_gold.json --out data/thai_gold.json || echo "thai gold skipped"
          python3 scripts/sync_insights.py || echo "insights sync skipped"

      - name: Commit and push
        env:
          TZ: Asia/Bangkok
        run: |
          git config user.name "purefxaidev"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/levels.json assets/xau-klines.json assets/quotes.json assets/spdr.json assets/perf.json assets/trade_plan.json assets/thai_gold.json \
            data/xau-klines.json data/quotes.json data/live.json data/perf.json data/trade_plan.json data/thai_gold.json \
            data/events.json data/cot.json data/feargreed.json data/compare.json data/brief.json data/dollar.json \
            share/*.png \
            index.html || true
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "update levels $(date '+%F %H:%M')"
          git pull --rebase --autostash origin main
          git push origin main
